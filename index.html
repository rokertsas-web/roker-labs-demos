<!-- ──────────────────────────────────────────────────────────────────
  SW KILLER v2 — fuerza reload cuando encuentra SW activo.

  Problema raíz: el SW viejo de Workbox sirve el HTML cacheado ANTES
  de que el cleanup corra. Sin reload(true), el usuario sigue viendo
  la versión rota aunque el SW se haya desregistrado.

  Flujo correcto:
    1ª visita con SW viejo → encuentra SWs → desregistra → borra caches
                           → reload(true) fuerza GET a la red (bypass SW)
    2ª visita (post-reload) → no hay SWs → no recarga → página fresca ✓
    Visitas siguientes → igual, sin SW, sin reload, sin problema ✓

  El flag "sw-killed" en sessionStorage corta el loop: si ya se recargó
  en esta sesión, no vuelve a hacerlo aunque algo quede raro.
────────────────────────────────────────────────────────────────── -->
<script>
(function () {
  // Borrar todos los caches de la Cache API (async, no bloquea)
  if ('caches' in window) {
    caches.keys()
      .then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); })
      .catch(function () {});
  }

  if (!('serviceWorker' in navigator)) return;

  // Si ya recargamos en esta sesión, no volvemos a hacerlo
  var alreadyKilled = sessionStorage.getItem('sw-killed');

  navigator.serviceWorker.getRegistrations()
    .then(function (regs) {
      if (regs.length === 0) return; // sin SW activo, sin problema

      // Desregistrar todos
      return Promise.all(regs.map(function (r) { return r.unregister(); }))
        .then(function () {
          if (!alreadyKilled) {
            sessionStorage.setItem('sw-killed', '1');
            // reload(true) = fuerza GET directo a la red, ignora cache del browser
            window.location.reload(true);
          }
        });
    })
    .catch(function () {});
})();
</script>

<!-- Sticky WA bar — mobile only — aparece después de 320px scroll -->
<div class="wa-sticky" id="wa-sticky" role="complementary" aria-label="Contacto rápido">
  <button class="wa-sticky__close" id="wa-sticky-close" aria-label="Cerrar">×</button>
  <a
    class="wa-sticky__btn"
    id="wa-sticky-btn"
    href="https://wa.me/5491153839101?text=Hola%20Sergio%2C%20vi%20la%20landing%20de%20Roker%20Labs%20y%20quiero%20saber%20m%C3%A1s%20sobre%20tus%20sistemas."
    target="_blank"
    rel="noopener noreferrer"
  >
    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.2-1.3c1.5.8 3.1 1.2 4.8 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2zm5.5 14.1c-.2.6-1.3 1.2-1.8 1.3-.5.1-1 .1-1.6-.1-.4-.1-.9-.3-1.5-.6-2.6-1.1-4.3-3.7-4.4-3.9-.1-.2-1-1.4-1-2.7s.7-1.9.9-2.1c.2-.2.5-.3.7-.3h.5c.2 0 .4 0 .6.5.2.6.7 2 .8 2.1.1.1.1.3 0 .5-.1.2-.1.3-.3.5-.1.1-.3.3-.4.5-.1.1-.3.3-.1.5.1.3.6 1.1 1.4 1.7 1 .8 1.8 1.1 2.1 1.2.3.1.4.1.5 0 .2-.2.6-.7.8-.9.2-.2.3-.2.6-.1.2.1 1.4.7 1.7.8.2.1.4.2.5.2.1.2.1.6-.1 1.2z"/>
    </svg>
    Agendar demo gratis
  </a>
</div>
<script>
(function () {
  var bar = document.getElementById('wa-sticky');
  var closeBtn = document.getElementById('wa-sticky-close');
  var dismissed = false;
  var SCROLL_THRESHOLD = 320;

  // Ajustar WA href según country cookie si existe
  function getCountry() {
    var m = document.cookie.match(/(?:^|; )roker_country=([^;]*)/);
    return m ? decodeURIComponent(m[1]) : 'AR';
  }
  function buildWaHref(country) {
    var phone = '5491153839101';
    var text = country === 'PY'
      ? 'Hola Sergio, vi la landing de Roker Labs (PY) y quiero saber más sobre tus sistemas.'
      : 'Hola Sergio, vi la landing de Roker Labs y quiero saber más sobre tus sistemas.';
    return 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);
  }
  document.getElementById('wa-sticky-btn').href = buildWaHref(getCountry());

  // Mostrar/ocultar según scroll y proximidad al #contacto
  function update() {
    if (dismissed) return;
    var y = window.scrollY || window.pageYOffset;
    var contact = document.getElementById('contacto');
    var nearContact = contact && (y + window.innerHeight >= contact.getBoundingClientRect().top + y - 80);
    if (y > SCROLL_THRESHOLD && !nearContact) {
      bar.classList.add('is-visible');
    } else {
      bar.classList.remove('is-visible');
    }
  }

  window.addEventListener('scroll', update, { passive: true });
  closeBtn.addEventListener('click', function () {
    dismissed = true;
    bar.style.display = 'none';
  });
})();
</script>
